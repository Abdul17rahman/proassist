<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>ProAssit</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <div class="container">

    <h1>ProAssit</h1>

    <label for="recipient">To</label>
    <input id="recipient" type="email" placeholder="recipient@example.com">

    <label for="subject">Subject</label>
    <input id="subject" type="text" placeholder="Email subject">

    <label for="body">Message</label>
    <textarea id="body" placeholder="Write your message..."></textarea>

    <button id="sendButton">
      Send Email
    </button>

    <p id="status"></p>

  </div>

  <script src="popup.js"></script>

</body>

</html>
